name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, and don't waste a queued run that is now stale.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` validates package-lock.json strictly, and its resolution rules
      # change between npm majors. Pinning to the version that wrote the lockfile
      # keeps CI from failing on an unrelated npm upgrade.
      - name: Pin npm
        run: npm install -g npm@10.7.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Project Pages are served from https://<user>.github.io/<repo>/, so every
        # asset URL has to be prefixed with that subpath.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          # Nitro's public dir: prerendered HTML + hashed client assets.
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
