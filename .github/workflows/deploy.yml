name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, and don't waste a queued run that is now stale.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` validates package-lock.json strictly, and its resolution rules
      # change between npm majors. Pinning to the version that wrote the lockfile
      # keeps CI from failing on an unrelated npm upgrade.
      - name: Pin npm
        run: npm install -g npm@10.7.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        # public/CNAME sets a custom domain, which is served from the site root, so
        # assets are root-relative. For a project page instead, set this to
        # /${{ github.event.repository.name }}/.
        env:
          BASE_PATH: "/"
        run: npm run build

      # Fails the build early if the custom domain in public/CNAME has no matching
      # DNS, rather than deploying a site that silently 404s.
      - name: Verify custom domain DNS
        if: hashFiles('public/CNAME') != ''
        run: |
          domain="$(tr -d '\r\n' < public/CNAME)"
          echo "Checking DNS for $domain"
          for ip in 185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153; do
            if host -t A "$domain" 2>/dev/null | grep -q "$ip"; then
              echo "OK: $domain resolves to GitHub Pages ($ip)"
              exit 0
            fi
          done
          echo "::warning::$domain does not resolve to GitHub Pages yet."
          echo "Add A records for 185.199.108.153, 185.199.109.153, 185.199.110.153 and"
          echo "185.199.111.153 at your DNS provider, then re-run this workflow."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          # Nitro's public dir: prerendered HTML + hashed client assets.
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
